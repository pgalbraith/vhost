[workspace]
resolver = "2"

members = [
    "vhost",
    "vhost-user-backend",
]

[workspace.dependencies]
virtio-bindings = "0.2.7"
virtio-queue = "0.18.0"
# default-features off: rawfd is a hard compile_error!() on Windows. Member
# crates re-enable it for unix.
vm-memory = { version = "0.18.0", default-features = false }
vmm-sys-util = "0.15.0"

# Pre-PR scaffolding: pins unpublished fixes by git rev so a standalone clone builds on Windows
# without extra setup. `[patch]` only applies from the top-level manifest of what's being built,
# so this has no effect on consumers of these crates — only on building this repo directly.
# Remove before submitting upstream. Fixes are on pgalbraith/rust-vmm's `windows-raw` branch,
# not yet in a PR.
[patch.crates-io]
vm-memory = { git = "https://github.com/pgalbraith/rust-vmm.git", rev = "b6f828af858d9c749a66908f189f0c06e47ba7b6" }
vmm-sys-util = { git = "https://github.com/pgalbraith/rust-vmm.git", rev = "b6f828af858d9c749a66908f189f0c06e47ba7b6" }
