[workspace]
resolver = "2"

members = [
    "vhost",
    "vhost-user-backend",
]

[workspace.dependencies]
virtio-bindings = "0.2.7"
virtio-queue = "0.18.0"
# `default-features = false` here so member crates can opt out of vm-memory's default
# `rawfd` feature, which is a hard `compile_error!()` on Windows targets.
vm-memory = { version = "0.18.0", default-features = false }
vmm-sys-util = "0.15.0"

# Pre-PR scaffolding: neither fix below is published yet. Pinned by git rev so a standalone
# clone of this repo builds on Windows without extra local setup, matching how the sibling
# virtiofsd workspace pins the same commit in its own manifest. Cargo only honors a `[patch]`
# section from the top-level manifest of whatever's being built, so this has no effect on
# anyone consuming `vhost`/`vhost-user-backend` as a dependency — only on building this repo
# directly. Remove before submitting upstream; the two fixes are on
# https://github.com/pgalbraith/rust-vmm's `windows-support` branch, not yet in a PR either.
[patch.crates-io]
vm-memory = { git = "https://github.com/pgalbraith/rust-vmm.git", rev = "18c378454a50a0c17890c461d3383e3ac881885c" }
vmm-sys-util = { git = "https://github.com/pgalbraith/rust-vmm.git", rev = "18c378454a50a0c17890c461d3383e3ac881885c" }
