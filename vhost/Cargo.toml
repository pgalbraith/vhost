[package]
name = "vhost"
version = "0.17.0"
keywords = ["vhost", "vhost-user", "virtio", "vdpa"]
description = "a pure rust library for vdpa, vhost and vhost-user"
authors = ["Liu Jiang <gerry@linux.alibaba.com>"]
repository = "https://github.com/rust-vmm/vhost"
documentation = "https://docs.rs/vhost"
readme = "README.md"
license = "Apache-2.0 OR BSD-3-Clause"
edition = "2021"

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "RUSTDOC_disable_feature_compat_errors"]

[features]
default = []
test-utils = []
vhost-vsock = []
vhost-kern = []
vhost-vdpa = ["vhost-kern"]
vhost-net = ["vhost-kern"]
vhost-user = []
vhost-user-frontend = ["vhost-user"]
vhost-user-backend = ["vhost-user"]
xen = ["vm-memory/xen"]
postcopy = []

[dependencies]
bitflags = "2.4"
libc = "0.2.39"
uuid = { version = "1.11.0", default-features = false, features=["v4", "fast-rng"] }

vmm-sys-util = { workspace = true }
# `default-features = false` drops vm-memory's default `rawfd` feature, which is a hard
# `compile_error!()` on Windows targets. It is re-enabled for unix below so that behaviour
# on existing platforms is unchanged.
vm-memory = { workspace = true, default-features = false, features = ["backend-mmap"] }

[target.'cfg(unix)'.dependencies]
vm-memory = { workspace = true, features = ["rawfd"] }

[target."cfg(windows)".dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.2.0"
serial_test = "4.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(RUSTDOC_disable_feature_compat_errors)'] }

[package.metadata.cargo-all-features]
skip_feature_sets = [
    ["xen", "postcopy"]
]

denylist = ["test_utils"]
